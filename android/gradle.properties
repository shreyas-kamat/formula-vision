org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pub cache (C:) and project (D:) sit on different drives; Kotlin's incremental
# compiler can't serialize cross-root relative paths on Windows, which crashes
# the daemon and forces a slow full rebuild. Disabling incremental compilation
# avoids the failure (negligible cost — the only Kotlin here is plugin glue).
kotlin.incremental=false
